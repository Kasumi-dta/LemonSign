name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Beta
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Decrypt Protected Core
        env:
          CORE_KEY: ${{ secrets.LEMON_CORE_KEY }}
        run: |
          if [ -f lemon_core.enc ]; then
            echo "🔐 Decrypting LemonSign core engine using AES-256..."
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 100000 \
              -in lemon_core.enc \
              -out lemon_core.tar.gz \
              -pass pass:"$CORE_KEY"
            tar -xzf lemon_core.tar.gz
            rm -f lemon_core.tar.gz
            echo "✅ Core engine decrypted and restored successfully."
          else
            echo "ℹ️ No encrypted core found, proceeding with repository sources."
          fi

      - name: Build
        run: |
          make

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## Commit: \`$COMMIT_MSG\` (${{ github.sha }})" >> release_notes.md
          echo "### New in this build (Compared to $LATEST_OFFICIAL_TAG):" >> release_notes.md
            
          CHANGES=$(git log --pretty=format:"* %s (%h)" ${LATEST_OFFICIAL_TAG}..HEAD)
            
          if [ -z "$CHANGES" ]; then
            echo "* No code changes since $LATEST_OFFICIAL_TAG" >> release_notes.md
          else
            echo "$CHANGES" >> release_notes.md
          fi
          
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

          APP_VER=$(jq -r '.apps[0].version' repo.json 2>/dev/null || echo "1.6.3.1")
          gh release delete beta3 --cleanup-tag -y || true
          
          gh release create beta3 packages/*.ipa \
            --title "LemonSign Beta 3 (v$APP_VER)" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}

          gh release delete beta --cleanup-tag -y || true
          
          gh release create beta packages/*.ipa \
            --title "LemonSign Beta Build" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          REPO="${{ github.repository }}"
          TAG="beta3"
          FILENAME="LemonSign.ipa"
          
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          
          echo "Sending link to Discord..."
          
          jq -n \
            --arg commit_msg "$COMMIT_MSG" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_url "$RELEASE_URL" \
            '{content: "**New Beta Released!**\n\nChanges: `\($commit_msg)`\n\n[**Download IPA**](\($download_url))\n[View Release](\($release_url))"}' > discord_payload.json

          curl -v \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK" || true
